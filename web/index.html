<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Stream Deck</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Roboto", "Droid Sans", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -ms-touch-action: manipulation; touch-action: manipulation;
    -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 38px;
    line-height: 38px; padding: 0 14px; font-size: 14px; color: #8b949e; white-space: nowrap; }
  #tabs { position: absolute; left: 10px; top: 0; right: 34px; white-space: normal; line-height: 0; padding-bottom: 5px; }
  .tab { display: inline-block; height: 28px; line-height: 28px; margin: 5px 6px 0 0; padding: 0 12px;
    border-radius: 6px; background: #161b22; color: #8b949e; font-size: 13px;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top; }
  .tab.on { background: #30363d; color: #fff; }
  .tab i { display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 7px;
    background: #6e7681; vertical-align: 1px; }
  .tab i.up { background: #2da44e; }
  .tab i.down { background: #cf222e; }
  .tab.add { padding: 0 11px; color: #fff; }
  #dots .pn { display: inline-block; color: #6e7681; font-size: 12px; vertical-align: top; line-height: 26px; margin-right: 4px; }
  #sheet .chk { display: block; color: #c9d1d9; font-size: 14px; margin-top: 12px; }
  #sheet .chk input { width: 20px; height: 20px; vertical-align: middle; margin: 0 8px 0 0; }
  #tools { position: absolute; right: 34px; top: 0; line-height: 0; padding-bottom: 5px; }
  #tools.row2 { left: 4px; right: 4px; text-align: center; white-space: normal; }
  .tb { display: inline-block; height: 28px; line-height: 28px; margin: 5px 0 0 6px;
    padding: 0 12px; border-radius: 14px; background: #21262d; color: #fff; font-size: 13px;
    white-space: nowrap; vertical-align: top; }
  .tb.down, .tab.down { opacity: 0.6; }
  .tb.hi { background: #1f6feb; }
  .tb.red { background: #8e1519; }
  .tb.new { background: #238636; }
  #sheet .notes { white-space: pre-wrap; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 8px; font-size: 13px; color: #c9d1d9; max-height: 220px; overflow: auto; }
  #sheet p { color: #c9d1d9; font-size: 14px; line-height: 20px; margin: 6px 0; }
  #conn { position: absolute; right: 14px; top: 14px; width: 10px; height: 10px;
    border-radius: 5px; background: #2da44e; }
  #conn.off { background: #cf222e; }
  .key { position: absolute; border-radius: 18%; background: #161b22; overflow: hidden; text-align: center;
    -webkit-box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    -webkit-transition: -webkit-transform 70ms; transition: transform 70ms; cursor: pointer; }
  .key.empty { background: #0d1117; -webkit-box-shadow: none; box-shadow: none; }
  .key.down { -webkit-transform: scale(0.92); transform: scale(0.92); }
  .editing .key { -webkit-box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); }
  .editing .key.empty { background: #0d1117; -webkit-box-shadow: inset 0 0 0 2px #30363d; box-shadow: inset 0 0 0 2px #30363d; }
  .editing .key.from { -webkit-box-shadow: inset 0 0 0 4px #fff; box-shadow: inset 0 0 0 4px #fff; }
  .key .ic { position: absolute; left: 0; right: 0; }
  .key .ic svg { display: block; margin: 0 auto; }
  .key .lb { position: absolute; left: 4px; right: 4px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .key .fl { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 18%; opacity: 0;
    -webkit-transition: opacity 300ms; transition: opacity 300ms; }
  .key .fl.ok { background: rgba(255,255,255,0.35); opacity: 1; }
  .key .fl.err { background: rgba(207,34,46,0.8); opacity: 1; }
  #dots { position: absolute; left: 0; right: 0; height: 26px; text-align: center; }
  #dots span { display: inline-block; padding: 9px 6px; }
  #dots i { display: block; width: 8px; height: 8px; border-radius: 4px; background: #30363d; }
  #dots span.on i { background: #fff; }
  #msg { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: #8b949e; font-size: 16px; padding: 0 20px; }
  #toast { position: absolute; left: 50%; bottom: 34px; width: 360px; margin-left: -180px; text-align: center;
    background: #21262d; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; display: none; }
  #toast.err { background: #8e1519; }

  /* painel de edicao */
  #panel { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; }
  #sheet { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 640px; margin-left: -320px;
    background: #161b22; border-radius: 12px; overflow: auto; -webkit-overflow-scrolling: touch;
    -webkit-user-select: text; user-select: text; }
  #sheet .in { padding: 14px 18px 18px; }
  #sheet h3 { margin: 0 0 10px; font-size: 17px; font-weight: normal; }
  #sheet label { display: block; color: #8b949e; font-size: 13px; margin: 12px 0 5px; }
  #sheet input[type=text], #sheet select, #sheet textarea { width: 100%; box-sizing: border-box; -webkit-box-sizing: border-box;
    background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 6px; padding: 8px; font-size: 16px; }
  #sheet textarea { height: 90px; font-family: monospace; font-size: 13px; }
  #sheet .help { color: #6e7681; font-size: 12px; margin-top: 4px; line-height: 16px; }
  .icons span, .colors span { display: inline-block; width: 40px; height: 40px; margin: 0 6px 6px 0;
    border-radius: 8px; background: #21262d; vertical-align: top; text-align: center; line-height: 40px; font-size: 11px; color: #8b949e; }
  .icons span svg { margin-top: 8px; }
  .icons span.sel, .colors span.sel { -webkit-box-shadow: 0 0 0 2px #fff; box-shadow: 0 0 0 2px #fff; }
  @media (max-width: 660px) { #sheet { left: 8px; right: 8px; width: auto; margin-left: 0; } }
  .row { margin-top: 18px; text-align: right; }
  .row .tb { height: 36px; line-height: 36px; padding: 0 16px; border-radius: 18px; font-size: 14px; }
  .row .left { float: left; }
</style>
</head>
<body>
<div id="bar"><div id="tabs"></div>
  <div id="tools"></div><div id="conn"></div></div>
<div id="grid"></div>
<div id="dots"></div>
<div id="msg">Carregando…</div>
<div id="toast"></div>
<div id="panel"><div id="sheet"><div class="in" id="form"></div></div></div>

<script>
(function () {
  "use strict";

  var S = ' stroke="#fff" stroke-width="2" fill="none" ';
  var ICONS = {
    playpause: '<path d="M3 5v14l9-7z M14 5h3v14h-3z M19 5h2v14h-2z" fill="#fff"/>',
    prev: '<path d="M6 6h2v12H6z M9.5 12L18 18V6z" fill="#fff"/>',
    next: '<path d="M16 6h2v12h-2z M6 18l8.5-6L6 6z" fill="#fff"/>',
    volup: '<path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M15 12h7M18.5 8.5v7"' + S + '/>',
    voldown: '<path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M15 12h7"' + S + '/>',
    mute: '<path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M15 9l6 6M21 9l-6 6"' + S + '/>',
    globe: '<circle cx="12" cy="12" r="9"' + S + '/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"' + S + '/>',
    folder: '<path d="M3 6h7l2 2h9v11H3z" fill="#fff"/>',
    calc: '<rect x="5" y="3" width="14" height="18" rx="2"' + S + '/><rect x="8" y="6" width="8" height="3" fill="#fff"/><path d="M8 12h2v2H8zM14 12h2v2h-2zM8 16h2v2H8zM14 16h2v2h-2z" fill="#fff"/>',
    camera: '<path d="M4 7h4l2-2h4l2 2h4v12H4z" fill="#fff"/><circle cx="12" cy="13" r="3.5" fill="rgba(0,0,0,0.45)"/>',
    desktop: '<rect x="3" y="4" width="18" height="12" rx="1"' + S + '/><path d="M8 20h8M12 16v4"' + S + '/>',
    chart: '<path d="M4 20V10h3v10zM10.5 20V4h3v16zM17 20v-7h3v7z" fill="#fff"/>',
    lock: '<rect x="5" y="10" width="14" height="11" rx="2" fill="#fff"/><path d="M8 10V7a4 4 0 0 1 8 0v3"' + S + '/>',
    keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"' + S + '/><path d="M5 9h2v2H5zM9 9h2v2H9zM13 9h2v2h-2zM17 9h2v2h-2zM7 14h10v2H7z" fill="#fff"/>',
    record: '<circle cx="12" cy="12" r="7" fill="#fff"/>',
    copy: '<rect x="8" y="8" width="12" height="13" rx="1"' + S + '/><path d="M4 16V4h12"' + S + '/>',
    paste: '<rect x="5" y="4" width="14" height="17" rx="1"' + S + '/><rect x="9" y="2" width="6" height="4" rx="1" fill="#fff"/>',
    cut: '<circle cx="6" cy="18" r="3"' + S + '/><circle cx="18" cy="18" r="3"' + S + '/><path d="M8 16L18 3M16 16L6 3"' + S + '/>',
    undo: '<path d="M9 4L4 9l5 5"' + S + '/><path d="M4 9h10a5.5 5.5 0 0 1 0 11h-3"' + S + '/>',
    redo: '<path d="M15 4l5 5-5 5"' + S + '/><path d="M20 9H10a5.5 5.5 0 0 0 0 11h3"' + S + '/>',
    save: '<path d="M4 4h13l3 3v13H4z"' + S + '/><rect x="7" y="4" width="8" height="5" fill="#fff"/><rect x="7" y="13" width="10" height="7" fill="#fff"/>',
    select: '<rect x="4" y="4" width="16" height="16" stroke-dasharray="3 2"' + S + '/>',
    apps: '<rect x="3" y="3" width="8" height="8" fill="#fff"/><rect x="13" y="3" width="8" height="8" fill="#fff"/><rect x="3" y="13" width="8" height="8" fill="#fff"/><rect x="13" y="13" width="8" height="8" fill="#fff"/>',
    close: '<path d="M5 5l14 14M19 5L5 19"' + S + '/>',
    plus: '<path d="M12 4v16M4 12h16"' + S + '/>',
    mic: '<rect x="9" y="2" width="6" height="12" rx="3" fill="#fff"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"' + S + '/>',
    smile: '<circle cx="12" cy="12" r="9"' + S + '/><path d="M8 14a5 5 0 0 0 8 0"' + S + '/><circle cx="9" cy="9.5" r="1.3" fill="#fff"/><circle cx="15" cy="9.5" r="1.3" fill="#fff"/>',
    gear: '<circle cx="12" cy="12" r="3.5"' + S + '/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"' + S + '/>',
    back: '<path d="M15 4l-8 8 8 8"' + S + '/>',
    forward: '<path d="M9 4l8 8-8 8"' + S + '/>',
    scene: '<rect x="3" y="5" width="18" height="14" rx="1"' + S + '/><path d="M6 16l4-5 3 3 2-2 3 4z" fill="#fff"/>',
    play: '<path d="M7 4v16l13-8z" fill="#fff"/>',
    stop: '<rect x="6" y="6" width="12" height="12" fill="#fff"/>',
    star: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z" fill="#fff"/>',
    heart: '<path d="M12 20s-8-5-8-10.5A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 8 2.5C20 15 12 20 12 20z" fill="#fff"/>',
    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#fff"/>',
    home: '<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"' + S + '/>',
    mail: '<rect x="3" y="5" width="18" height="14" rx="1"' + S + '/><path d="M3 6l9 7 9-7"' + S + '/>',
    music: '<path d="M9 18V5l11-2v13" ' + S + '/><circle cx="6.5" cy="18" r="2.5" fill="#fff"/><circle cx="17.5" cy="16" r="2.5" fill="#fff"/>',
    code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"' + S + '/>',
    power: '<path d="M12 2v10"' + S + '/><path d="M6.3 5.7a8 8 0 1 0 11.4 0"' + S + '/>',
    sound: '<path d="M3 9v6h4l5 5V4L7 9H3z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13"' + S + '/>',
    chat: '<path d="M4 4h16v11H9l-5 4z"' + S + '/><path d="M8 8.5h8M8 11.5h5"' + S + '/>',
    playlist: '<path d="M3 6h13M3 11h13M3 16h8"' + S + '/><path d="M15 14l6 3.5-6 3.5z" fill="#fff"/>',
    radio: '<rect x="3" y="8" width="18" height="12" rx="2"' + S + '/><path d="M7 8l10-5M6 12h4M6 15.5h4"' + S + '/><circle cx="15.5" cy="14" r="2.5" fill="#fff"/>',
    headphones: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"' + S + '/><rect x="3" y="14" width="4" height="7" rx="1" fill="#fff"/><rect x="17" y="14" width="4" height="7" rx="1" fill="#fff"/>',
    bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z" fill="#fff"/><path d="M10 20.5a2 2 0 0 0 4 0"' + S + '/>'
  };
  var COLORS = ["#1f6feb", "#0a3069", "#8250df", "#bf3989", "#cf222e", "#d1490b",
                "#bf8700", "#2da44e", "#1b7c83", "#57606a", "#24292f", "#000000"];
  var ACTIONS = [["none", "Nada (espaço vazio)"], ["hotkey", "Atalho de teclado"],
                 ["open", "Abrir site, arquivo ou programa"], ["command", "Rodar comando"],
                 ["page", "Ir para outra página"], ["multi", "Sequência de ações (avançado)"],
                 ["sound", "Rádio: tocar efeito sonoro"], ["stopsound", "Rádio: parar efeitos sonoros"],
                 ["text", "Rádio: digitar mensagem no chat"], ["http", "Rádio: chamar API do programa"]];
  var DEFAULT_ICON = { sound: "sound", stopsound: "stop", text: "chat", http: "radio" };

  function qs(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var TOKEN = qs("k");
  var denied = false;   /* codigo recusado: para de tentar (evita bloqueio por tentativas) */
  var cfg = null, page = 0, keys = [], editing = false, moveFrom = -1;
  var grid = $("grid"), dots = $("dots"), msg = $("msg"), conn = $("conn");

  /* ------------------------------------------------------------ rede --- */
  function req(method, url, body, cb) {
    var x = new XMLHttpRequest(), done = false;
    x.open(method, url + (url.indexOf("?") < 0 ? "?" : "&") + (TOKEN ? "k=" + encodeURIComponent(TOKEN) + "&" : "") + "t=" + new Date().getTime(), true);
    var timer = setTimeout(function () { try { x.abort(); } catch (e) {} finish(); }, 8000);
    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      var data = null, status = 0;
      try { status = x.status; data = JSON.parse(x.responseText); } catch (e) {}
      conn.className = status === 0 ? "off" : "";
      if (status === 403 && data && data.error === "codigo de acesso invalido") denied = true;
      cb(status === 200 && data && data.ok !== false, data, status, x);
    }
    x.onreadystatechange = function () { if (x.readyState === 4) finish(); };
    x.onerror = finish;
    x.setRequestHeader("X-StreamDeck", "1");
    if (body) x.setRequestHeader("Content-Type", "application/json");
    x.send(body || null);
  }
  var toastT = null;
  function toast(text, err) {
    var t = $("toast");
    t.innerHTML = esc(text);
    t.className = err ? "err" : "";
    t.style.display = "block";
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.style.display = "none"; }, err ? 4000 : 1500);
  }

  function saveCfg(newCfg, done) {
    req("POST", "/api/config", JSON.stringify(newCfg), function (ok, data) {
      if (ok) {
        cfg = newCfg;
        if (data && data.v) cfgV = data.v;
        cacheCfg();
        if (page >= cfg.pages.length) page = cfg.pages.length - 1;
        render();
        toast("Salvo");
        if (done) done(true);
      } else {
        toast("Não salvou: " + ((data && data.error) || "sem conexão com o PC"), true);
        if (done) done(false);
      }
    });
  }

  /* ----------------------------------------------------------- grade --- */
  function svg(name, size) {
    var body = ICONS[name];
    if (!body) return "";
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
      '" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' + body + "</svg>";
  }

  function flash(el, ok) {
    var f = el.querySelector(".fl");
    f.className = "fl " + (ok ? "ok" : "err");
    setTimeout(function () { f.className = "fl"; }, ok ? 150 : 600);
  }

  function goPage(to) {
    if (cfg.pages[to]) { page = to; moveFrom = -1; render(); }
  }

  var REPEAT = { volumeup: 1, volumedown: 1, left: 1, right: 1, up: 1, down: 1, pageup: 1, pagedown: 1 };
  var pending = 0;

  /* segurar o botao repete (so volume e setas: repetir outros atalhos seria perigoso) */
  function canRepeat(i) {
    if (editing || !cfg) return false;
    var b = cfg.pages[page].buttons[i], a = b && b.action;
    return !!(a && a.type === "hotkey" && a.keys && a.keys.length === 1 && REPEAT[String(a.keys[0]).toLowerCase()]);
  }

  function press(i, el, repeating) {
    if (editing) return editTap(i);
    var b = cfg.pages[page].buttons[i];
    if (!b || !b.action || b.action.type === "none") return;
    if (b.action.type === "page") return goPage(b.action.to);
    if (repeating && pending > 0) return;       /* nao empilha pedidos se a rede estiver lenta */
    flash(el, true);                            /* resposta visual na hora */
    pending++;
    req("GET", "/api/press?p=" + page + "&b=" + i, null, function (ok, data, status) {
      pending--;
      if (ok) return;
      flash(el, false);
      toast(status === 0 ? "Sem conexão com o PC" : ((data && data.error) || "Não funcionou"), true);
    });
  }

  function tap(el, fn, repeatable) {
    var touched = false, sx = 0, sy = 0, cancelled = false, repeated = false, holdT = null, repT = null;
    function up() {
      el.className = el.className.replace(/ down/g, "");
      clearTimeout(holdT); clearInterval(repT);
    }
    el.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      touched = true; cancelled = false; repeated = false;
      sx = t.clientX; sy = t.clientY;
      up();
      el.className += " down";
      e.preventDefault();
      if (repeatable && repeatable()) {
        holdT = setTimeout(function () {
          repeated = true;
          fn(true);
          repT = setInterval(function () { fn(true); }, 130);
        }, 450);
      }
    }, false);
    el.addEventListener("touchmove", function (e) {
      var t = e.touches[0], lim = Math.max(30, el.offsetWidth * 0.6);
      if (!cancelled && (Math.abs(t.clientX - sx) > lim || Math.abs(t.clientY - sy) > lim)) { cancelled = true; up(); }
    }, false);
    el.addEventListener("touchend", function (e) {
      up(); e.preventDefault();
      if (!cancelled && !repeated) fn(false);
    }, false);
    el.addEventListener("touchcancel", function () { cancelled = true; up(); }, false);
    el.addEventListener("mousedown", function () { if (!touched) el.className += " down"; }, false);
    el.addEventListener("mouseup", up, false);
    el.addEventListener("mouseleave", up, false);
    el.addEventListener("click", function () { if (!touched) fn(false); }, false);
  }

  function canFullscreen() {
    var d = document.documentElement;
    return !!(d.requestFullscreen || d.webkitRequestFullscreen);
  }
  function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFullscreen() {
    var d = document.documentElement;
    try {
      if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    } catch (e) {}
    setTimeout(function () { if (cfg) render(); }, 400);
  }

  function renderBar() {
    var t = $("tools");
    t.innerHTML = "";
    var items = editing
      ? [["Renomear", renamePage, ""], ["+ Página", addPage, ""], ["Excluir página", delPage, "red"],
         ["Grade " + cfg.columns + "×" + cfg.rows, gridSize, ""]]
      : [];
    if (editing && canFullscreen()) items.push([isFullscreen() ? "Sair da tela cheia" : "Tela cheia", toggleFullscreen, ""]);
    if (editing || updAvail()) items.push([updAvail() ? "● Atualização" : "Atualizações", openUpdates, updAvail() ? "new" : ""]);
    items.push(editing ? ["Concluir", toggleEdit, "hi"] : ["✎ Editar", toggleEdit, ""]);
    for (var i = 0; i < items.length; i++) {
      var s = document.createElement("span");
      s.className = "tb " + items[i][2];
      s.innerHTML = esc(items[i][0]);
      tap(s, items[i][1]);
      t.appendChild(s);
    }
    renderTabs();
  }

  function render() {
    renderBar();
    var pg = cfg.pages[page];
    grid.className = editing ? "editing" : "";
    grid.innerHTML = "";
    keys = [];
    var n = cfg.columns * cfg.rows;
    for (var i = 0; i < n; i++) {
      var b = pg.buttons[i];
      var el = document.createElement("div");
      var empty = !b || !b.action || b.action.type === "none";
      el.className = "key" + (empty ? " empty" : "") + (i === moveFrom ? " from" : "");
      if (!empty && b.color) el.style.background = b.color;
      el.innerHTML = '<div class="ic"></div><div class="lb"></div><div class="fl"></div>';
      if (!empty) el.querySelector(".lb").innerHTML = esc(b.label || "");
      if (!empty || editing) (function (idx, e) {
        tap(e, function (rep) { press(idx, e, rep); }, function () { return canRepeat(idx); });
      })(i, el);
      grid.appendChild(el);
      keys.push({ el: el, b: b, empty: empty, ic: el.firstChild, lb: el.childNodes[1], drawn: null });
    }
    var d = '<b class="pn">' + esc(pg.name || "") + "</b>";
    if (cfg.pages.length > 1 || editing) {
      for (var j = 0; j < cfg.pages.length; j++) d += '<span class="' + (j === page ? "on" : "") + '"><i></i></span>';
    }
    dots.innerHTML = d;
    var sp = dots.getElementsByTagName("span");
    for (var k = 0; k < sp.length; k++) (function (idx) { tap(sp[idx], function () { goPage(idx); }); })(k);
    layout();
  }

  /* altura da barra: abas e botoes quebram linha em telas estreitas */
  function barHeight(W) {
    var tools = $("tools"), tabs = $("tabs");
    var narrow = editing && W < 760;
    tools.className = narrow ? "row2" : "";
    tabs.style.right = narrow ? "34px" : (tools.offsetWidth + 44) + "px";
    var th = tabs.offsetHeight || 38;
    tools.style.top = narrow ? th + "px" : "0";
    return Math.max(38, narrow ? th + tools.offsetHeight : Math.max(th, tools.offsetHeight));
  }

  function fit(W, H, cols, rows, gap) {
    return Math.floor(Math.min((W - gap * (cols + 1)) / cols, (H - gap * (rows + 1)) / rows));
  }

  function layout() {
    if (!cfg) return;
    var W = window.innerWidth, H = window.innerHeight;
    var top = barHeight(W), bottom = 26;
    var gap = Math.round(Math.min(W, H) * 0.025);
    /* em pe (celular), inverte colunas e linhas se os botoes ficarem maiores */
    var cols = cfg.columns, rows = cfg.rows;
    if (fit(W, H - top - bottom, rows, cols, gap) > fit(W, H - top - bottom, cols, rows, gap)) { cols = cfg.rows; rows = cfg.columns; }
    var size = Math.max(24, fit(W, H - top - bottom, cols, rows, gap));
    var gw = size * cols + gap * (cols - 1), gh = size * rows + gap * (rows - 1);
    var x0 = Math.round((W - gw) / 2), y0 = top + Math.round((H - top - bottom - gh) / 2);
    var iconSize = Math.round(size * 0.42), font = Math.max(9, Math.round(size * 0.13));
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], c = i % cols, r = Math.floor(i / cols), st = k.el.style;
      st.left = (x0 + c * (size + gap)) + "px"; st.top = (y0 + r * (size + gap)) + "px";
      st.width = size + "px"; st.height = size + "px";
      var ic = k.ic, lb = k.lb;
      if (k.empty) {
        var plus = editing ? "+" + iconSize : "";
        if (k.drawn !== plus) { ic.innerHTML = editing ? svg("plus", iconSize).replace(/#fff/g, "#30363d") : ""; k.drawn = plus; }
        ic.style.top = Math.round((size - iconSize) / 2) + "px";
        continue;
      }
      var hasIcon = k.b.icon && ICONS[k.b.icon];
      var want = hasIcon ? k.b.icon + iconSize : "";
      if (k.drawn !== want) { ic.innerHTML = hasIcon ? svg(k.b.icon, iconSize) : ""; k.drawn = want; }   /* so redesenha se mudou */
      ic.style.top = Math.round(size * 0.17) + "px";
      lb.style.fontSize = (hasIcon ? font : Math.round(font * 1.4)) + "px";
      lb.style.top = (hasIcon ? Math.round(size * 0.68) : Math.round(size / 2 - font * 0.8)) + "px";
      lb.style.whiteSpace = hasIcon ? "nowrap" : "normal";
    }
    dots.style.top = (H - bottom) + "px";
  }

  var layoutT = null;
  function layoutSoon() { clearTimeout(layoutT); layoutT = setTimeout(layout, 60); }

  /* ---------------------------------------------------------- edicao --- */
  function toggleEdit() {
    editing = !editing;
    moveFrom = -1;
    render();
  }

  function editTap(i) {
    if (moveFrom >= 0) {
      if (i !== moveFrom) {
        var c = clone(cfg), bs = c.pages[page].buttons;
        while (bs.length <= Math.max(i, moveFrom)) bs.push({ label: "", icon: "", color: "", action: { type: "none" } });
        var tmp = bs[i]; bs[i] = bs[moveFrom]; bs[moveFrom] = tmp;
        moveFrom = -1;
        saveCfg(c);
      } else { moveFrom = -1; render(); }
      return;
    }
    openEditor(i);
  }

  function renamePage() {
    var n = window.prompt("Nome da página:", cfg.pages[page].name || "");
    if (n === null) return;
    var c = clone(cfg); c.pages[page].name = n; saveCfg(c);
  }

  function addPage() {
    var n = window.prompt("Nome da nova página:", "Página " + (cfg.pages.length + 1));
    if (n === null) return;
    var c = clone(cfg), bs = [], total = c.columns * c.rows;
    for (var i = 0; i < total; i++) bs.push({ label: "", icon: "", color: "", action: { type: "none" } });
    bs[total - 1] = { label: "Voltar", icon: "back", color: "#0a3069", action: { type: "page", to: 0 } };
    c.pages.push({ name: n, buttons: bs });
    page = c.pages.length - 1;
    saveCfg(c);
  }

  function fixPageRefs(a, removed) {
    if (!a) return a;
    if (a.type === "page") {
      if (a.to === removed) return { type: "none" };
      if (a.to > removed) a.to -= 1;
    }
    return a;
  }

  function delPage() {
    if (cfg.pages.length < 2) return toast("Precisa ficar ao menos uma página.", true);
    if (!window.confirm('Excluir a página "' + (cfg.pages[page].name || "") + '" e todos os botões dela?')) return;
    var c = clone(cfg), removed = page;
    c.pages.splice(removed, 1);
    for (var p = 0; p < c.pages.length; p++) {
      var bs = c.pages[p].buttons;
      for (var i = 0; i < bs.length; i++) {
        bs[i].action = fixPageRefs(bs[i].action, removed);
        if (bs[i].action.type === "none") { bs[i].label = ""; bs[i].icon = ""; bs[i].color = ""; }
      }
    }
    page = Math.max(0, removed - 1);
    saveCfg(c);
  }

  function gridSize() {
    var v = window.prompt("Colunas x linhas (ex.: 5x3). Máximo 10x8.", cfg.columns + "x" + cfg.rows);
    if (v === null) return;
    var m = /^\s*(\d+)\s*[x×*]\s*(\d+)\s*$/i.exec(v);
    if (!m) return toast("Use o formato 5x3.", true);
    var c = clone(cfg);
    c.columns = parseInt(m[1], 10); c.rows = parseInt(m[2], 10);
    saveCfg(c);
  }

  /* formulario de um botao */
  var draft = null, draftIdx = -1;

  function openEditor(i) {
    var b = cfg.pages[page].buttons[i];
    draft = clone(b || { label: "", icon: "", color: "#1f6feb", action: { type: "none" } });
    if (!draft.action) draft.action = { type: "none" };
    if (draft.action.type === "none" && !draft.color) draft.color = "#1f6feb";
    draftIdx = i;
    drawForm();
    $("panel").style.display = "block";
    $("sheet").scrollTop = 0;
    loadInfo(function () { if (draft && draft.action.type === "sound") { readForm(); drawForm(); } });
  }

  function closeEditor() {
    $("panel").style.display = "none";
    $("form").innerHTML = "";
    draft = null;
  }

  function keysToText(a) { return (a.keys || []).join("+"); }

  function drawForm() {
    var a = draft.action, h = [];
    h.push("<h3>Botão " + (draftIdx + 1) + " · " + esc(cfg.pages[page].name || "") + "</h3>");

    h.push('<label>O que ele faz</label><select id="f_type">');
    for (var i = 0; i < ACTIONS.length; i++) {
      h.push('<option value="' + ACTIONS[i][0] + '"' + (a.type === ACTIONS[i][0] ? " selected" : "") + ">" + ACTIONS[i][1] + "</option>");
    }
    h.push("</select>");

    if ((a.type === "command" || a.type === "open" || a.type === "http" || a.type === "multi") &&
        info && !info.local && !info.remote_admin) {
      h.push('<div class="help" style="color:#d29922">Por segurança, botões que rodam comandos, abrem programas/arquivos ou chamam APIs só podem ser criados ou alterados no próprio PC (abra o Stream Deck no navegador do PC) ou se você liberar em Conectar &gt; Segurança, no PC. Abrir sites (http/https) é permitido.</div>');
    }
    if (a.type === "hotkey") {
      h.push('<label>Teclas (separe com +)</label><input type="text" id="f_keys" value="' + esc(keysToText(a)) + '" placeholder="ctrl+shift+m" autocapitalize="off" autocorrect="off">');
      h.push('<div class="help">Letras, números, ctrl, shift, alt, win, enter, esc, tab, space, backspace, delete, home, end, pageup, pagedown, left, up, right, down, printscreen, f1…f24, playpause, next, prev, stop, mute, volumeup, volumedown, e . , - = ; /</div>');
    } else if (a.type === "open") {
      h.push('<label>Endereço ou caminho</label><input type="text" id="f_target" value="' + esc(a.target || "") + '" placeholder="https://… ou C:\\Pasta\\programa.exe" autocapitalize="off" autocorrect="off">');
    } else if (a.type === "command") {
      h.push('<label>Comando do Windows</label><input type="text" id="f_command" value="' + esc(a.command || "") + '" placeholder="notepad" autocapitalize="off" autocorrect="off">');
    } else if (a.type === "page") {
      h.push('<label>Página</label><select id="f_to">');
      for (var p = 0; p < cfg.pages.length; p++) {
        h.push('<option value="' + p + '"' + (a.to === p ? " selected" : "") + ">" + (p + 1) + ". " + esc(cfg.pages[p].name || "") + "</option>");
      }
      h.push("</select>");
    } else if (a.type === "multi") {
      var steps = a.steps || [{ type: "hotkey", keys: ["ctrl", "c"] }, { type: "hotkey", keys: ["ctrl", "v"] }];
      h.push('<label>Passos (JSON)</label><textarea id="f_steps" autocapitalize="off" autocorrect="off">' + esc(JSON.stringify(steps, null, 1)) + "</textarea>");
      h.push('<label>Pausa entre passos (segundos)</label><input type="text" id="f_delay" value="' + esc(a.delay == null ? 0.2 : a.delay) + '">');
      h.push('<div class="help">Cada passo é uma ação: {"type":"hotkey","keys":["ctrl","c"]}, {"type":"sound","file":"vinheta.mp3"}, {"type":"text","text":"Olá!","enter":true}, {"type":"open","target":"…"} ou {"type":"command","command":"…"}.</div>');
    } else if (a.type === "sound") {
      var snd = (info && info.sounds) || [];
      if (snd.length) {
        h.push('<label>Sons da pasta "sons"</label><select id="f_pick"><option value="">— escolher —</option>');
        for (var si = 0; si < snd.length; si++) {
          h.push('<option value="' + esc(snd[si]) + '"' + (a.file === snd[si] ? " selected" : "") + ">" + esc(snd[si]) + "</option>");
        }
        h.push("</select>");
      }
      h.push('<label>Arquivo</label><input type="text" id="f_file" value="' + esc(a.file || "") + '" placeholder="vinheta.mp3 ou C:\\Sons\\aplausos.wav" autocapitalize="off" autocorrect="off">');
      h.push('<div class="help">Coloque os arquivos MP3 ou WAV na pasta <b>sons</b>, dentro da pasta StreamDeck do PC; eles aparecem na lista acima. Também aceita o caminho completo de qualquer arquivo.</div>');
      h.push('<label>Volume (0 a 100)</label><input type="text" id="f_volume" value="' + esc(a.volume == null ? 100 : a.volume) + '" style="width:100px">');
      h.push('<label class="chk"><input type="checkbox" id="f_excl"' + (a.exclusive ? " checked" : "") + '>Parar os outros sons antes de tocar este</label>');
    } else if (a.type === "stopsound") {
      h.push('<div class="help">Para na hora todos os efeitos sonoros tocados pelo Stream Deck.</div>');
    } else if (a.type === "text") {
      h.push('<label>Mensagem</label><textarea id="f_text">' + esc(a.text || "") + "</textarea>");
      h.push('<label class="chk"><input type="checkbox" id="f_enter"' + (a.enter !== false ? " checked" : "") + '>Apertar Enter no final (enviar)</label>');
      h.push('<div class="help">O texto é digitado onde o cursor estiver no PC. Deixe o campo de mensagem do chat selecionado.</div>');
    } else if (a.type === "http") {
      h.push('<label>Método</label><select id="f_method"><option' + (a.method !== "POST" ? " selected" : "") + '>GET</option><option' + (a.method === "POST" ? " selected" : "") + ">POST</option></select>");
      h.push('<label>Endereço da API</label><input type="text" id="f_url" value="' + esc(a.url || "") + '" placeholder="http://127.0.0.1:porta/…" autocapitalize="off" autocorrect="off">');
      h.push('<label>Corpo (só para POST, opcional)</label><textarea id="f_body" autocapitalize="off" autocorrect="off">' + esc(a.body || "") + "</textarea>");
      h.push('<div class="help">Para programas de rádio que têm API web (veja no manual do programa o endereço e os comandos). A chamada sai do PC, então 127.0.0.1 aponta para o próprio PC. Se o programa não tiver API, use “Atalho de teclado” com as teclas de atalho configuradas nele.</div>');
    }

    if (a.type !== "none") {
      h.push('<label>Texto</label><input type="text" id="f_label" value="' + esc(draft.label || "") + '" maxlength="40">');
      h.push('<label>Ícone</label><div class="icons" id="f_icons"><span data-v=""' + (!draft.icon ? ' class="sel"' : "") + ">sem</span>");
      for (var name in ICONS) {
        if (ICONS.hasOwnProperty(name)) h.push('<span data-v="' + name + '"' + (draft.icon === name ? ' class="sel"' : "") + ">" + svg(name, 24) + "</span>");
      }
      h.push("</div>");
      h.push('<label>Cor</label><div class="colors" id="f_colors">');
      for (var c = 0; c < COLORS.length; c++) {
        h.push('<span data-v="' + COLORS[c] + '" style="background:' + COLORS[c] + '"' + (draft.color === COLORS[c] ? ' class="sel"' : "") + "></span>");
      }
      h.push('</div><input type="text" id="f_color" value="' + esc(draft.color || "") + '" placeholder="#1f6feb" style="width:140px" autocapitalize="off">');
    }

    h.push('<div class="row"><span class="tb left" id="b_move">Mover</span>');
    if (a.type !== "none") h.push('<span class="tb red left" id="b_clear">Limpar</span>');
    h.push('<span class="tb" id="b_cancel">Cancelar</span><span class="tb hi" id="b_save">Salvar</span></div>');
    $("form").innerHTML = h.join("");

    $("f_type").onchange = function () {
      readForm();
      var t = this.value;
      draft.action = { type: t };
      if (t === "page") draft.action.to = 0;
      if (t === "text") draft.action.enter = true;
      if (!draft.icon && DEFAULT_ICON[t]) draft.icon = DEFAULT_ICON[t];
      drawForm();
    };
    if ($("f_pick")) $("f_pick").onchange = function () { if (this.value) $("f_file").value = this.value; };
    pick("f_icons", function (v) { draft.icon = v; });
    pick("f_colors", function (v) { draft.color = v; if ($("f_color")) $("f_color").value = v; });
    tap($("b_cancel"), closeEditor);
    tap($("b_save"), saveDraft);
    tap($("b_move"), function () { moveFrom = draftIdx; closeEditor(); render(); toast("Toque no lugar para onde ele vai"); });
    if ($("b_clear")) tap($("b_clear"), function () {
      draft = { label: "", icon: "", color: "", action: { type: "none" } }; commitDraft();
    });
  }

  function pick(id, fn) {
    var box = $(id);
    if (!box) return;
    var sp = box.getElementsByTagName("span");
    for (var i = 0; i < sp.length; i++) {
      (function (s) {
        s.onclick = function () {
          for (var j = 0; j < sp.length; j++) sp[j].className = "";
          s.className = "sel";
          fn(s.getAttribute("data-v"));
        };
      })(sp[i]);
    }
  }

  function val(id) { var e = $(id); return e ? e.value : null; }

  /* le os campos para o rascunho; devolve mensagem de erro ou "" */
  function readForm() {
    var a = draft.action;
    if (val("f_label") !== null) draft.label = val("f_label");
    if (val("f_color") !== null) draft.color = val("f_color").replace(/^\s+|\s+$/g, "");
    if (a.type === "hotkey") {
      var parts = (val("f_keys") || "").toLowerCase().split("+"), ks = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i].replace(/^\s+|\s+$/g, "");
        if (p) ks.push(p);
      }
      a.keys = ks;
      if (!ks.length) return "Informe as teclas.";
    } else if (a.type === "open") {
      a.target = (val("f_target") || "").replace(/^\s+|\s+$/g, "");
      if (!a.target) return "Informe o que abrir.";
    } else if (a.type === "command") {
      a.command = (val("f_command") || "").replace(/^\s+|\s+$/g, "");
      if (!a.command) return "Informe o comando.";
    } else if (a.type === "page") {
      a.to = parseInt(val("f_to"), 10) || 0;
    } else if (a.type === "multi") {
      try { a.steps = JSON.parse(val("f_steps")); } catch (e) { return "Os passos não são um JSON válido."; }
      a.delay = parseFloat(val("f_delay")) || 0;
    } else if (a.type === "sound") {
      a.file = (val("f_file") || "").replace(/^\s+|\s+$/g, "");
      var vol = parseInt(val("f_volume"), 10);
      a.volume = isNaN(vol) ? 100 : Math.max(0, Math.min(100, vol));
      a.exclusive = !!($("f_excl") && $("f_excl").checked);
      if (!a.file) return "Escolha o arquivo de som.";
    } else if (a.type === "text") {
      a.text = val("f_text") || "";
      a.enter = !!($("f_enter") && $("f_enter").checked);
      if (!a.text) return "Escreva a mensagem.";
    } else if (a.type === "http") {
      a.method = val("f_method") || "GET";
      a.url = (val("f_url") || "").replace(/^\s+|\s+$/g, "");
      a.body = val("f_body") || "";
      if (!/^https?:\/\//.test(a.url)) return "O endereço deve começar com http:// ou https://";
    }
    if (draft.color && !/^#[0-9a-fA-F]{3,6}$/.test(draft.color)) return "Cor inválida (use #rrggbb).";
    return "";
  }

  function saveDraft() {
    var err = readForm();
    if (err) return toast(err, true);
    if (draft.action.type === "none") draft = { label: "", icon: "", color: "", action: { type: "none" } };
    commitDraft();
  }

  function commitDraft() {
    var c = clone(cfg), bs = c.pages[page].buttons;
    while (bs.length <= draftIdx) bs.push({ label: "", icon: "", color: "", action: { type: "none" } });
    bs[draftIdx] = draft;
    saveCfg(c, function (ok) { if (ok) closeEditor(); });
  }

  /* ---------------------------------------------------- atualizacoes --- */
  var updToastShown = false, updPoll = null;
  function updAvail() { return !!(info && info.update && info.update.available); }

  function openUpdates() {
    drawUpdates(info && info.update);
    $("panel").style.display = "block";
    $("sheet").scrollTop = 0;
    req("GET", "/api/update", null, function (ok, u) { if (ok && u) { info.update = u; drawUpdates(u); } });
  }

  function drawUpdates(u) {
    var h = ["<h3>Atualizações</h3>"];
    if (!u) {
      h.push("<p>Verificando…</p>");
    } else {
      h.push("<p>Versão instalada: <b>" + esc(u.version) + "</b>" + (u.latest ? " · última publicada: <b>" + esc(u.latest) + "</b>" : "") + "</p>");
      if (u.state === "downloading") h.push("<p>Baixando a atualização no PC…</p>");
      else if (u.state === "restarting") h.push("<p>Reiniciando com a versão nova…</p>");
      else if (u.available) h.push('<p style="color:#3fb950">Há uma versão nova. Seus botões, abas e sons são mantidos.</p>');
      else if (u.latest) h.push("<p>Você está na versão mais recente.</p>");
      if (u.error) h.push('<p style="color:#8b949e">Não foi possível verificar: ' + esc(u.error) + "</p>");
      if (u.checked) h.push('<p style="color:#8b949e">Última verificação: ' + esc(u.checked) + "</p>");
      if (u.available && u.notes) h.push('<label>O que mudou</label><div class="notes">' + esc(u.notes) + "</div>");
      if (u.available && !u.auto) h.push("<p>Para atualizar, baixe a versão nova no PC: " + esc(u.page || "") + "</p>");
    }
    h.push('<div class="row"><span class="tb left" id="u_check">Verificar agora</span><span class="tb" id="u_close">Fechar</span>');
    if (u && u.available && u.auto && u.state !== "downloading" && u.state !== "restarting") h.push('<span class="tb hi" id="u_apply">Atualizar agora</span>');
    h.push("</div>");
    $("form").innerHTML = h.join("");
    tap($("u_close"), closeEditor);
    tap($("u_check"), function () {
      $("form").innerHTML = "<h3>Atualizações</h3><p>Verificando…</p>";
      req("POST", "/api/update/check", "{}", function (ok, r) {
        if (ok && r) { info.update = r; renderBar(); }
        drawUpdates(info.update);
      });
    });
    if ($("u_apply")) tap($("u_apply"), function () {
      if (!window.confirm("Atualizar o Stream Deck no PC agora? Ele reinicia sozinho e seus botões são mantidos.")) return;
      req("POST", "/api/update/apply", "{}", function (ok, r) {
        if (!ok) return toast("Não atualizou: " + ((r && r.error) || "sem conexão"), true);
        var from = info.update.version;
        info.update.state = "downloading";
        drawUpdates(info.update);
        clearInterval(updPoll);
        updPoll = setInterval(function () {
          req("GET", "/api/update", null, function (ok2, u2) {
            if (ok2 && u2 && u2.version !== from) { clearInterval(updPoll); location.reload(); }
            else if (ok2 && u2) { info.update = u2; if ($("panel").style.display === "block") drawUpdates(u2); }
          });
        }, 3000);
      });
    });
  }

  /* ------------------------------------------- abas (um PC por aba) --- */
  var CONNS_KEY = "sd_conns", conns = [], here = location.host, info = null, alive = {}, synced = null;

  function lsGet() {
    try { var l = JSON.parse(window.localStorage.getItem(CONNS_KEY)); return l && l.length != null ? l : []; }
    catch (e) { return []; }
  }
  function lsSet(l) { try { window.localStorage.setItem(CONNS_KEY, JSON.stringify(l)); } catch (e) {} }
  /* guarda no navegador e tambem no PC (abas.json), para nao depender so do navegador */
  function saveConns() {
    lsSet(conns);
    req("POST", "/api/tabs", JSON.stringify(conns), function (ok, data) {
      if (!ok) toast("Abas não salvas no PC: " + ((data && data.error) || "sem conexão"), true);
    });
  }

  /* lista de abas que veio de outro PC no endereco (#sync=...) */
  function readSync() {
    var m = /[#&]sync=([^&]*)/.exec(location.hash);
    if (!m) return;
    try {
      var l = JSON.parse(decodeURIComponent(m[1]));
      if (l && l.length != null) { synced = l; lsSet(l); }
    } catch (e) {}
    if (window.history && history.replaceState) history.replaceState(null, "", location.pathname);
    else location.hash = "";
  }

  function loadInfo(cb) {
    req("GET", "/api/info", null, function (ok, data) {
      if (ok && data) {
        info = data;
        /* prioridade: lista que veio de outro PC > salva no navegador > salva neste PC */
        if (!conns.length) conns = synced || lsGet();
        if (!conns.length && data.tabs && data.tabs.length) conns = data.tabs;
        synced = null;
        var found = null;
        for (var i = 0; i < conns.length; i++) if (conns[i].host === here) found = conns[i];
        if (!found) conns.unshift({ name: data.name || here, host: here, code: data.code });
        else found.code = data.code;
        saveConns();
        if (cfg) renderBar(); else renderTabs();
        if (updAvail() && !updToastShown) {
          updToastShown = true;
          toast("Nova versão " + data.update.latest + " disponível. Toque em “Atualização”.");
        }
      }
      if (cb) cb();
    });
  }

  function renderTabs() {
    var box = $("tabs");
    box.innerHTML = "";
    var hasHere = false;
    for (var i = 0; i < conns.length; i++) {
      var c = conns[i], isHere = c.host === here;
      if (isHere) hasHere = true;
      var st = isHere ? "up" : (alive[c.host] === true ? "up" : alive[c.host] === false ? "down" : "");
      var el = document.createElement("span");
      el.className = "tab" + (isHere ? " on" : "");
      el.innerHTML = '<i class="' + st + '"></i>' + esc(c.name || c.host);
      (function (idx) {
        tap(el, function () {
          if (editing || conns[idx].host === here) {
            if (editing) openConnForm(idx);
            return;
          }
          switchTo(idx);
        });
      })(i);
      box.appendChild(el);
    }
    var add = document.createElement("span");
    add.className = "tab add";
    add.innerHTML = "+";
    tap(add, function () { openConnForm(-1); });
    box.appendChild(add);
    if (cfg) layoutSoon();   /* a barra pode ter mudado de altura */
  }

  function pingAll() {
    for (var i = 0; i < conns.length; i++) {
      (function (h) {
        if (h === here) return;
        var img = new Image(), done = false;
        function fin(v) { if (done) return; done = true; if (alive[h] !== v) { alive[h] = v; renderTabs(); } }
        img.onload = function () { fin(true); };
        img.onerror = function () { fin(false); };
        setTimeout(function () { fin(false); }, 3000);
        img.src = "http://" + h + "/ping.gif?t=" + new Date().getTime();
      })(conns[i].host);
    }
  }

  function switchTo(idx) {
    var c = conns[idx];
    if (alive[c.host] === false &&
        !window.confirm('"' + (c.name || c.host) + '" não respondeu. Tentar abrir mesmo assim?')) return;
    location.href = "http://" + c.host + "/?k=" + encodeURIComponent(c.code || "") +
      "&sync=" + encodeURIComponent(JSON.stringify(conns));
  }

  function openConnForm(idx) {
    var c = idx >= 0 ? conns[idx] : { name: "", host: "", code: "" };
    var isHere = c.host === here && idx >= 0, h = [];
    h.push("<h3>" + (idx >= 0 ? "Aba: " + esc(c.name || c.host) : "Nova aba (outro PC)") + "</h3>");
    h.push('<label>Nome da aba</label><input type="text" id="c_name" value="' + esc(c.name || "") + '" placeholder="Casa, Trabalho, Rádio…" maxlength="30">');
    if (isHere) {
      h.push('<div class="help">Esta é a aba do PC aberto agora (' + esc(here) + "). Só o nome pode ser mudado.</div>");
    } else {
      h.push('<label>Endereço do PC (IP:porta)</label><input type="text" id="c_host" value="' + esc(c.host || "") + '" placeholder="192.168.0.20:8765" autocapitalize="off" autocorrect="off">');
      h.push('<label>Código de acesso</label><input type="text" id="c_code" value="' + esc(c.code || "") + '" placeholder="o código depois de ?k= na janela do servidor" autocapitalize="off" autocorrect="off">');
      h.push('<div class="help">Os dois aparecem na janela do servidor daquele PC: http://<b>IP:porta</b>/?k=<b>código</b>. Só a aba aberta controla o PC dela.</div>');
    }
    h.push('<div class="row">');
    if (idx >= 0 && !isHere) h.push('<span class="tb red left" id="c_del">Excluir aba</span>');
    h.push('<span class="tb" id="c_cancel">Cancelar</span><span class="tb hi" id="c_save">Salvar</span></div>');
    $("form").innerHTML = h.join("");
    $("panel").style.display = "block";
    $("sheet").scrollTop = 0;

    tap($("c_cancel"), closeEditor);
    if ($("c_del")) tap($("c_del"), function () {
      if (!window.confirm('Excluir a aba "' + (c.name || c.host) + '"?')) return;
      conns.splice(idx, 1); saveConns(); closeEditor(); renderTabs();
    });
    tap($("c_save"), function () {
      var n = { name: (val("c_name") || "").replace(/^\s+|\s+$/g, ""), host: c.host, code: c.code };
      if (!isHere) {
        n.host = (val("c_host") || "").replace(/^\s+|\s+$/g, "").replace(/^https?:\/\//, "").replace(/\/.*$/, "");
        n.code = (val("c_code") || "").replace(/^\s+|\s+$/g, "");
        if (!/^[A-Za-z0-9.\-]+(:\d{1,5})?$/.test(n.host)) return toast("Endereço inválido. Ex.: 192.168.0.20:8765", true);
        if (!n.code) return toast("Informe o código de acesso.", true);
        for (var j = 0; j < conns.length; j++) {
          if (j !== idx && conns[j].host === n.host) return toast("Já existe uma aba para esse endereço.", true);
        }
      }
      if (!n.name) n.name = n.host;
      if (idx >= 0) conns[idx] = n; else conns.push(n);
      saveConns(); closeEditor(); renderTabs(); pingAll();
      toast("Aba salva");
    });
  }

  /* ----------------------------------------------------------- inicio --- */
  var cfgV = null, CFG_KEY = "sd_cfg_" + here, offlineToast = false;
  function cacheCfg() { try { window.localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
  function cachedCfg() {
    try { var c = JSON.parse(window.localStorage.getItem(CFG_KEY)); return c && c.pages && c.pages.length ? c : null; }
    catch (e) { return null; }
  }
  function panelOpen() { return $("panel").style.display === "block"; }

  function load() {
    req("GET", "/api/config", null, function (ok, data, status, x) {
      if (ok && data && data.pages) {
        cfg = data;
        try { cfgV = x.getResponseHeader("X-Config-Version"); } catch (e) {}
        cacheCfg();
        offlineToast = false;
        msg.style.display = "none";
        if (page >= cfg.pages.length) page = 0;
        render();
        if (!info) loadInfo(pingAll);
      } else if (status === 403 || status === 429) {
        cfg = null; keys = [];
        grid.innerHTML = ""; dots.innerHTML = ""; $("tools").innerHTML = "";
        try { window.localStorage.removeItem(CFG_KEY); } catch (e) {}
        msg.style.display = "block";
        msg.innerHTML = status === 403
          ? "Este aparelho ainda não tem o código de acesso (ou ele foi trocado). No PC, abra a tela Conectar e leia o QR code."
          : "Muitas tentativas com código errado. Aguarde 10 minutos e leia o QR code de novo na tela do PC.";
      } else {
        if (!conns.length) { conns = synced || lsGet(); renderTabs(); pingAll(); }
        if (cfg) {              /* mostra os botoes guardados e continua tentando */
          if (!offlineToast) { offlineToast = true; toast("Sem conexão com o PC. Tentando de novo…", true); }
        } else {
          msg.style.display = "block";
          msg.innerHTML = "Sem conexão com o PC. Verifique se o Stream Deck está aberto no PC e se os dois estão na mesma rede.";
        }
        setTimeout(load, 3000);
      }
    });
  }

  /* consulta leve: detecta edicoes feitas em outro aparelho e versoes novas */
  function poll() {
    if (denied || !cfg || !cfgV || document.hidden) return;
    req("GET", "/api/state", null, function (ok, st, status) {
      if (!ok) { if (status === 403) load(); return; }
      if (offlineToast) { offlineToast = false; toast("Conectado"); }
      if (st.v !== cfgV && !editing && !panelOpen()) load();
      if (info && info.update && st.update !== !!info.update.available) loadInfo();
    });
  }

  window.addEventListener("resize", layoutSoon, false);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 300); }, false);
  document.addEventListener("touchmove", function (e) { if (!panelOpen()) e.preventDefault(); }, false);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { poll(); pingAll(); } }, false);
  setInterval(poll, 5000);
  setInterval(function () { if (!document.hidden) pingAll(); }, 20000);

  cfg = cachedCfg();
  if (cfg) { msg.style.display = "none"; render(); }   /* abre na hora com o que estava guardado */
  readSync();
  load();
})();
</script>
</body>
</html>

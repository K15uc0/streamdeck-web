name: Publicar versão

# Para publicar uma versão nova: altere VERSION em streamdeck/__init__.py, adicione a seção
# correspondente no CHANGELOG.md e envie para a branch main. Se ainda não
# existir release com esse número, o instalador e o .exe portátil são gerados e publicados.
# ORDEM DOS ARQUIVOS: os apps até a 2.4.0 baixam o ÚLTIMO .exe da release (ordem
# de envio). Por isso o instalador sobe primeiro e o StreamDeck.exe (arquivo
# único) por último; tudo vai para um RASCUNHO, a ordem é conferida pela API e
# só então a release é publicada.
on:
  push:
    branches: [main]
    paths: ["server.py", "streamdeck/**", "CHANGELOG.md", "web/**", "config.padrao.json", "tools/**", "icon.ico", "installer/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path streamdeck/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          $draft = gh release view "v$ver" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2> $null
          if ($LASTEXITCODE -eq 0 -and $draft -eq "true") {
            # rascunho que sobrou de uma execucao que falhou: apaga e publica de novo
            Write-Host "v$ver existe como rascunho (execucao anterior falhou): apagando."
            gh release delete "v$ver" --repo "${{ github.repository }}" --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          elseif ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$ver já publicada, nada a fazer." }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Testes (unittest)
        if: steps.ver.outputs.exists == 'false'
        run: python -m unittest discover -s tests -v

      - name: Instalar PyInstaller (bootloader compilado aqui)
        if: steps.ver.outputs.exists == 'false'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --no-binary pyinstaller pyinstaller==6.10.0

      - name: Gerar a ponte da status line (StreamDeckPonte.exe)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python tools/versao.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --onedir --console --noupx --name StreamDeckPonte --icon "$PWD/icon.ico" --version-file "$PWD/build/version_info.txt" --collect-submodules streamdeck --workpath build/ponte --specpath build/ponte --distpath dist/ponte ponte_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path build/ponte.zip) { Remove-Item build/ponte.zip }
          Compress-Archive -Path "dist/ponte/StreamDeckPonte/*" -DestinationPath build/ponte.zip

      - name: Gerar StreamDeck.exe (arquivo unico e pasta)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python tools/versao.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --onefile --windowed --noupx --name StreamDeck --icon "$PWD/icon.ico" --version-file "$PWD/build/version_info.txt" --add-data "$PWD/web;web" --add-data "$PWD/config.padrao.json;." --add-data "$PWD/build/ponte.zip;." --collect-submodules streamdeck --workpath build/onefile --specpath build/onefile --distpath dist server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pyinstaller --onedir --windowed --noupx --name StreamDeck --icon "$PWD/icon.ico" --version-file "$PWD/build/version_info.txt" --add-data "$PWD/web;web" --add-data "$PWD/config.padrao.json;." --add-data "$PWD/build/ponte.zip;." --collect-submodules streamdeck --workpath build/onedir --specpath build/onedir --distpath dist/onedir server.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # nada que nao abre e publicado
      - name: Testar o .exe portatil (abrir, API, fechar)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: ./tests/exe_smoke.ps1 -Exe dist/StreamDeck.exe

      - name: Testar o .exe da pasta (abrir, API, fechar)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: ./tests/exe_smoke.ps1 -Exe dist/onedir/StreamDeck/StreamDeck.exe

      - name: Gerar instalador (Inno Setup)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path streamdeck/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$ver" installer/streamdeck.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar o instalador (instalar, atualizar, desinstalar)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: ./tests/installer_smoke.ps1 -Installer dist-installer/StreamDeck-Instalador.exe

      - name: Notas da versão
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python tools/notas.py "${{ steps.ver.outputs.version }}" > notas.md
          $hi = (Get-FileHash dist-installer/StreamDeck-Instalador.exe -Algorithm SHA256).Hash.ToLower()
          $hp = (Get-FileHash dist/StreamDeck.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path notas.md -Encoding utf8 -Value "`nSHA-256 do StreamDeck-Instalador.exe: ``$hi``  `nSHA-256 do StreamDeck.exe (portátil): ``$hp``"
          Write-Host "SHA-256 instalador: $hi"
          Write-Host "SHA-256 portatil:   $hp"

      # 1o o instalador (cria a release como RASCUNHO: ninguem a ve ainda)...
      - name: Criar rascunho (instalador)
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Stream Deck ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist-installer/StreamDeck-Instalador.exe
          body_path: notas.md
          draft: true
          make_latest: false

      # ...depois o portatil: tem de ser o ULTIMO .exe (apps ate a 2.4.0)
      - name: Enviar StreamDeck.exe portátil (por último)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.ver.outputs.version }}" dist/StreamDeck.exe --repo "${{ github.repository }}"

      - name: Conferir ordem dos arquivos publicados
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # releases/tags/... nao enxerga rascunhos: procura na lista (que inclui rascunhos)
          $tag = "v${{ steps.ver.outputs.version }}"
          $rel = @(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json | ForEach-Object { $_ } | Where-Object { $_.tag_name -eq $tag -and $_.draft })[0]
          if (-not $rel) { Write-Host "::error::rascunho $tag nao encontrado"; exit 1 }
          $exes = @($rel.assets | Sort-Object id | Where-Object { $_.name.ToLower().EndsWith(".exe") })
          # tambem na ordem crua da API (e a que os apps antigos percorrem)
          $raw = @($rel.assets | Where-Object { $_.name.ToLower().EndsWith(".exe") })
          Write-Host ("arquivos .exe (API): " + (($raw | ForEach-Object { "$($_.name)#$($_.id)" }) -join ", "))
          if ($raw.Count -ne 2 -or $raw[-1].name -ne "StreamDeck.exe" -or $exes[-1].name -ne "StreamDeck.exe") {
            Write-Host "::error::o ultimo .exe do rascunho nao e o StreamDeck.exe: apps ate a 2.4.0 baixariam o arquivo errado. Rascunho apagado, nada foi publicado."
            gh release delete $tag --repo "${{ github.repository }}" --yes
            exit 1
          }
          if (-not ($raw | Where-Object { $_.name -eq "StreamDeck-Instalador.exe" })) {
            Write-Host "::error::instalador faltando. Rascunho apagado, nada foi publicado."
            gh release delete $tag --repo "${{ github.repository }}" --yes
            exit 1
          }
          Write-Host "ok: StreamDeck.exe e o ultimo .exe"

      # so agora a versao aparece para os apps (releases/latest)
      - name: Publicar a versão
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Publicar versão

# Para publicar uma versão nova: altere VERSION em streamdeck/__init__.py, adicione a seção
# correspondente no CHANGELOG.md e envie para a branch main. Se ainda não
# existir release com esse número, o .exe é gerado e publicado sozinho.
on:
  push:
    branches: [main]
    paths: ["server.py", "streamdeck/**", "CHANGELOG.md", "web/**", "config.padrao.json", "tools/**", "icon.ico", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler versão
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path streamdeck/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          gh release view "v$ver" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$ver já publicada, nada a fazer." }
          else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Testes (unittest)
        if: steps.ver.outputs.exists == 'false'
        run: python -m unittest discover -s tests -v

      - name: Instalar PyInstaller (bootloader compilado aqui)
        if: steps.ver.outputs.exists == 'false'
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install --no-binary pyinstaller pyinstaller==6.10.0

      - name: Gerar StreamDeck.exe
        if: steps.ver.outputs.exists == 'false'
        run: |
          python tools/versao.py
          pyinstaller --onefile --console --noupx --name StreamDeck --icon icon.ico --version-file build/version_info.txt --add-data "web;web" --add-data "config.padrao.json;." --collect-submodules streamdeck server.py

      # um .exe que nao abre nunca e publicado
      - name: Testar o .exe (abrir, API, fechar)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: ./tests/exe_smoke.ps1 -Exe dist/StreamDeck.exe

      - name: Notas da versão
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          python tools/notas.py "${{ steps.ver.outputs.version }}" > notas.md
          $hash = (Get-FileHash dist/StreamDeck.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path notas.md -Encoding utf8 -Value "`nSHA-256 do StreamDeck.exe: ``$hash``"
          Write-Host "SHA-256: $hash"

      - name: Publicar
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Stream Deck ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/StreamDeck.exe
          body_path: notas.md
          make_latest: true
